<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Almanac — Tasks, Time & Study</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#eadfca;--paper:#f6efe1;--paper2:#fbf7ee;--ink:#1a1511;--muted:#7b6a57;--line:#d8c9ae;--accent:#8a5a3b;--hi:#9b3d2e;--md:#b8863b;--lo:#6b7f5a;--ease:cubic-bezier(.22,.9,.22,1);--slow:cubic-bezier(.7,0,.2,1);
--serif:'Cormorant Garamond',Georgia,serif;--body:'EB Garamond',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1612;--paper:#262019;--paper2:#2d261e;--ink:#f3e9d6;--muted:#a59580;--line:#3e3428;--accent:#d3a77c;--hi:#d9705d;--md:#d9a955;--lo:#98b085}}
:root[data-theme="dark"]{--bg:#1b1612;--paper:#262019;--paper2:#2d261e;--ink:#f3e9d6;--muted:#a59580;--line:#3e3428;--accent:#d3a77c;--hi:#d9705d;--md:#d9a955;--lo:#98b085}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;min-height:100vh;overflow-x:hidden;transition:background .8s}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.55;z-index:0;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
.b1{width:46vw;height:46vw;background:#d9b98a;top:-12vw;left:-10vw}.b2{width:40vw;height:40vw;background:#c9a27c;bottom:-14vw;right:-8vw;animation-delay:-8s}.b3{width:28vw;height:28vw;background:#efd9b0;top:40%;left:50%;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vw,6vh) scale(1.25)}}
header{view-transition-name:hdr;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;padding:1rem clamp(1rem,4vw,3rem);backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 70%,transparent);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-size:2.1rem;font-weight:600;letter-spacing:.01em;font-style:italic;animation:rise 1.2s var(--ease) both}
.brand span{color:var(--accent)}
nav{position:relative;display:flex;gap:.2rem;margin-left:auto;padding:.3rem;border:1px solid var(--line);border-radius:99px;background:var(--paper)}
nav button{position:relative;z-index:1;border:0;background:none;color:var(--muted);font:500 1.1rem var(--serif);letter-spacing:.06em;padding:.5rem 1.1rem;border-radius:99px;cursor:pointer;transition:color .6s var(--ease)}
nav button.on{color:var(--paper2)}nav .ink{position:absolute;z-index:0;top:.3rem;bottom:.3rem;left:0;background:var(--ink);border-radius:99px;transition:transform .9s var(--ease),width .9s var(--ease)}
.btn{font:600 1.1rem var(--serif);letter-spacing:.05em;border:1px solid var(--ink);background:transparent;color:var(--ink);padding:.6rem 1.3rem;border-radius:99px;cursor:pointer;position:relative;overflow:hidden;transition:color .5s var(--ease),transform .5s var(--ease);z-index:0}
.btn::before{content:"";position:absolute;inset:0;background:var(--ink);transform:translateY(101%);transition:transform .6s var(--ease);z-index:-1;border-radius:inherit}
.btn:hover{color:var(--paper2);transform:translateY(-2px)}.btn:hover::before{transform:none}.btn.solid{background:var(--ink);color:var(--paper2)}.btn.solid::before{background:var(--accent)}
.theme{width:2.6rem;height:2.6rem;padding:0;border-radius:50%}
main{position:relative;z-index:1;padding:2rem clamp(1rem,4vw,3rem) 5rem;max-width:1300px;margin:0 auto}
h2{font:500 clamp(2.4rem,6vw,4.4rem)/1 var(--serif);letter-spacing:-.01em}h2 em{color:var(--accent)}
.sub{color:var(--muted);font-style:italic;margin:.4rem 0 1.6rem;font-size:1.2rem}
@keyframes rise{from{opacity:0;transform:translateY(34px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.anim .rise{animation:rise 1.1s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
::view-transition-old(root){animation:vOut .9s var(--slow) both}::view-transition-new(root){animation:vIn 1.1s var(--slow) both}::view-transition-group(hdr){animation:none}
@keyframes vOut{to{transform:translateY(-3%) scale(.97);opacity:0;filter:blur(8px)}}@keyframes vIn{from{clip-path:inset(0 0 100% 0);transform:translateY(4%)}to{clip-path:inset(0 0 0 0)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:0 1px 0 var(--paper2) inset,0 20px 50px -30px rgba(70,45,20,.45);transition:transform .7s var(--ease),box-shadow .7s var(--ease)}
.card.hov:hover{transform:translateY(-6px);box-shadow:0 30px 60px -30px rgba(70,45,20,.55)}
.pri{display:inline-flex;align-items:center;gap:.4rem;font:600 .8rem var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--c)}.pri::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:var(--c)}
.p-high{--c:var(--hi)}.p-med{--c:var(--md)}.p-low{--c:var(--lo)}
.cal-head{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}.cal-head h3{font:500 2.2rem var(--serif);flex:1;font-style:italic}
.round{width:2.8rem;height:2.8rem;border-radius:50%;border:1px solid var(--line);background:var(--paper);font:1.4rem var(--serif);cursor:pointer;color:var(--ink);transition:all .5s var(--ease)}.round:hover{background:var(--ink);color:var(--paper2);transform:scale(1.1) rotate(-8deg)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5rem}.grid.fl{animation:fromR .9s var(--ease)}.grid.fr{animation:fromL .9s var(--ease)}
@keyframes fromR{from{opacity:0;transform:translateX(80px) rotateY(12deg)}}@keyframes fromL{from{opacity:0;transform:translateX(-80px) rotateY(-12deg)}}
.dow{text-align:center;font:600 .9rem var(--serif);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:.3rem}
.day{min-height:clamp(70px,11vw,120px);padding:.5rem;background:var(--paper);border:1px solid var(--line);border-radius:14px;cursor:pointer;overflow:hidden;transition:all .6s var(--ease)}
.day:hover{background:var(--paper2);transform:scale(1.04);z-index:2;box-shadow:0 18px 30px -18px rgba(70,45,20,.5)}.day.dim{opacity:.4}.day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day b{font:600 1.15rem var(--serif)}.day.today b{background:var(--ink);color:var(--paper2);border-radius:99px;padding:0 .5rem}
.chip{display:block;margin-top:.25rem;font-size:.82rem;line-height:1.2;padding:.15rem .4rem;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:transform .4s var(--ease)}.chip:hover{transform:translateX(4px)}.chip.done{text-decoration:line-through;opacity:.5}
.group h4{font:italic 500 1.7rem var(--serif);margin:1.6rem 0 .6rem;color:var(--accent)}
.row{display:flex;align-items:center;gap:1rem;padding:1rem 1.3rem;margin-bottom:.7rem;cursor:pointer}.row .t{flex:1;min-width:0}.row .t strong{font:600 1.5rem var(--serif);display:block;transition:opacity .5s}.row .t small{color:var(--muted);font-style:italic}
.row.done strong{text-decoration:line-through;opacity:.45}
.chk{width:1.7rem;height:1.7rem;border-radius:50%;border:1.5px solid var(--ink);flex:none;display:grid;place-items:center;cursor:pointer;background:transparent;transition:all .6s var(--ease);color:transparent;font-size:1rem}.chk.on{background:var(--ink);color:var(--paper2);transform:rotate(360deg) scale(1.1)}
.tbl{width:100%;border-collapse:separate;border-spacing:0 .5rem}.tbl th{font:600 .9rem var(--serif);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.5rem 1rem;cursor:pointer;user-select:none;transition:color .4s}.tbl th:hover{color:var(--ink)}
.tbl td{padding:1rem;background:var(--paper);border-top:1px solid var(--line);border-bottom:1px solid var(--line);transition:background .5s}.tbl td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px}.tbl td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
.tbl tr:hover td{background:var(--paper2)}.tbl td.ti{font:600 1.3rem var(--serif)}.scroll{overflow-x:auto}
.empty{text-align:center;padding:4rem 1rem;font:italic 1.6rem var(--serif);color:var(--muted)}
.studygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1.4rem}.sc{padding:1.6rem}.sc header{all:unset;display:flex;align-items:center;gap:1rem}
.sc h3{font:600 2rem/1 var(--serif);flex:1}.ring{width:64px;height:64px;flex:none}.ring circle{fill:none;stroke-width:5}.ring .bg{stroke:var(--line)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset 1.6s var(--ease)}
.sc .it{display:flex;gap:.8rem;align-items:center;padding:.7rem 0;border-top:1px dashed var(--line)}.it.done span.n{text-decoration:line-through;opacity:.45}.it .n{flex:1;font-size:1.1rem}.it .n small{display:block;color:var(--muted);font-style:italic}
.x{border:0;background:none;color:var(--muted);font-size:1.5rem;cursor:pointer;transition:all .5s var(--ease)}.x:hover{color:var(--hi);transform:rotate(90deg)}
.veil{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);display:grid;place-items:center;padding:1rem;clip-path:circle(0 at var(--x,50%) var(--y,50%));transition:clip-path 1.1s var(--slow);overflow:auto}
.veil.open{clip-path:circle(150% at var(--x,50%) var(--y,50%))}
.sheet{width:min(640px,100%);padding:2rem;max-height:92vh;overflow:auto;opacity:0;transform:translateY(60px) scale(.96);transition:all 1s var(--ease) .3s}.veil.open .sheet{opacity:1;transform:none}
.sheet h3{font:italic 500 2.6rem var(--serif);margin-bottom:1rem}
label{display:block;font:600 .85rem var(--serif);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:1rem 0 .3rem}
input,textarea{width:100%;font:1.15rem var(--body);color:var(--ink);background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;outline:none;transition:all .5s var(--ease)}input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent);transform:translateY(-2px)}
input.big{font:500 2rem var(--serif);border:0;border-bottom:1.5px solid var(--ink);border-radius:0;background:none;padding:.4rem 0}
.two,.three{display:grid;gap:.8rem;grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr 1fr 1fr}
.pills{display:flex;gap:.6rem}.pills button{flex:1;padding:.6rem;border-radius:99px;border:1px solid var(--line);background:var(--paper2);font:600 1rem var(--serif);letter-spacing:.1em;cursor:pointer;color:var(--c);transition:all .5s var(--ease)}.pills button.on{background:var(--c);color:var(--paper2);transform:scale(1.06)}
.acts{display:flex;gap:.8rem;margin-top:1.6rem;justify-content:flex-end}.srow{display:grid;grid-template-columns:1.4fr 1fr 1.1fr .8fr .8fr auto;gap:.4rem;margin-bottom:.5rem;animation:rise .8s var(--ease)}.srow input{padding:.5rem;font-size:1rem}
@media(max-width:700px){.srow{grid-template-columns:1fr 1fr}.tbl{font-size:.95rem}}
.veil.morph .sheet{opacity:1;transform:none;transition:none;will-change:transform}
.veil.morph .sheet>*{animation:rise .9s var(--ease) both;animation-delay:calc(.5s + var(--i,0)*45ms)}
.chip[draggable]{cursor:grab}.chip.drag{opacity:.35;transform:scale(.9)}.day.over{background:color-mix(in srgb,var(--accent) 18%,var(--paper));transform:scale(1.07);box-shadow:0 0 0 2px var(--accent),0 24px 40px -18px rgba(70,45,20,.6)}
.x.ed:hover{transform:rotate(-15deg) scale(1.25);color:var(--accent)}
.cele{position:fixed;inset:0;z-index:100;background:var(--paper);display:grid;place-items:center;text-align:center;pointer-events:none;clip-path:inset(0 100% 0 0)}
.cele.in{clip-path:inset(0);transition:clip-path 1.1s var(--slow)}.cele.out{clip-path:inset(0 0 0 100%);transition:clip-path 1.1s var(--slow)}
.cele small{display:block;font:italic 1.5rem var(--serif);color:var(--accent);letter-spacing:.1em;opacity:0;transform:translateY(20px);transition:all 1s var(--ease) .5s}.cele.in small{opacity:1;transform:none}
.cele h1{font:600 clamp(3rem,11vw,9rem)/1.02 var(--serif);color:#0d0a07;padding:0 2rem;max-width:1200px;letter-spacing:-.02em}.cele h1 i{display:inline-block;font-style:normal;opacity:0;transform:translateY(.6em) rotate(4deg);filter:blur(10px);transition:all 1.1s var(--ease);transition-delay:calc(.45s + var(--k)*45ms)}.cele.in h1 i{opacity:1;transform:none;filter:none}
.cele hr{width:0;height:2px;background:#0d0a07;border:0;margin:1.5rem auto 0;transition:width 1.4s var(--slow) .9s}.cele.in hr{width:min(40vw,360px)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<header><div class="brand">Alma<span>nac</span></div>
<nav id="nav"><div class="ink"></div></nav>
<button class="btn solid" id="new">+ New Task</button><button class="btn theme" id="theme" title="Toggle theme">◐</button></header>
<main><div id="view"></div></main>
<div class="veil" id="veil"><div class="sheet card" id="sheet"></div></div>
<div class="cele" id="cele"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,TODAY=ymd(new Date());
const addD=n=>{const d=new Date();d.setDate(d.getDate()+n);return ymd(d)};
let S;try{S=JSON.parse(localStorage.getItem('almanac1'))}catch(e){}
if(!S)S={tasks:[{id:uid(),title:'Read chapter one slowly',pri:'high',date:TODAY,start:'09:00',end:'10:30',notes:'With coffee.',done:false},{id:uid(),title:'Write letters',pri:'low',date:addD(2),start:'16:00',end:'17:00',notes:'',done:false},{id:uid(),title:'Plan the week ahead',pri:'med',date:addD(1),start:'08:00',end:'08:45',notes:'',done:false}],
study:[{id:uid(),subject:'Art History',items:[{id:uid(),topic:'The Renaissance',chapter:'Ch. 3',date:TODAY,start:'18:00',end:'19:00',done:true},{id:uid(),topic:'Baroque Light',chapter:'Ch. 4',date:addD(1),start:'18:00',end:'19:00',done:false},{id:uid(),topic:'Impressionism',chapter:'Ch. 6',date:addD(3),start:'18:00',end:'19:30',done:false}]}]};
const save=()=>{try{localStorage.setItem('almanac1',JSON.stringify(S))}catch(e){}};
const V={cal:'Calendar',list:'List',table:'Table',study:'Study'};let view='cal',cal={y:new Date().getFullYear(),m:new Date().getMonth()},sort={k:'date',d:1},cdir='';
const PW={high:0,med:1,low:2},PN={high:'High',med:'Medium',low:'Low'};
const tm=t=>t?t:'—',rng=t=>t.start?`${t.start}${t.end?' – '+t.end:''}`:'all day';
const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'}):'—';
const nav=$('#nav');Object.entries(V).forEach(([k,v])=>{const b=document.createElement('button');b.textContent=v;b.dataset.k=k;b.onclick=()=>go(k);nav.append(b)});
function ink(){const b=$(`nav button[data-k=${view}]`),i=$('.ink');if(!b)return;i.style.width=b.offsetWidth+'px';i.style.transform=`translateX(${b.offsetLeft}px)`;nav.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b))}
function go(k){if(k===view)return;const run=()=>{view=k;render(true);ink()};document.startViewTransition?document.startViewTransition(run):run()}
function render(anim){const el=$('#view');el.className=anim?'anim':'';el.innerHTML=({cal:vCal,list:vList,table:vTable,study:vStudy})[view]();bind()}
const sorted=()=>[...S.tasks].sort((a,b)=>(a.date||'9')<(b.date||'9')?-1:(a.date||'9')>(b.date||'9')?1:(a.start||'')<(b.start||'')?-1:PW[a.pri]-PW[b.pri]);
function vCal(){const f=new Date(cal.y,cal.m,1),start=new Date(cal.y,cal.m,1-f.getDay()),name=f.toLocaleDateString('en',{month:'long',year:'numeric'});let cells='';
for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const s=ymd(d),ts=S.tasks.filter(t=>t.date===s).sort((a,b)=>(a.start||'')<(b.start||'')?-1:1);
cells+=`<div class="day ${d.getMonth()!==cal.m?'dim':''} ${s===TODAY?'today':''}" data-date="${s}"><b>${d.getDate()}</b>${ts.slice(0,3).map(t=>`<span class="chip p-${t.pri} ${t.done?'done':''}" draggable="true" data-id="${t.id}">${t.start?t.start+' ':''}${esc(t.title)}</span>`).join('')}${ts.length>3?`<span class="chip" style="--c:var(--muted)">+${ts.length-3} more</span>`:''}</div>`}
return `<h2 class="rise">The <em>Calendar</em></h2><p class="sub rise" style="--i:1">Tap a day to begin something new. Drag tasks between days.</p><div class="cal-head rise" style="--i:2"><h3>${name}</h3><button class="round" data-nav="-1">‹</button><button class="round" data-nav="1">›</button></div>
<div class="grid rise" style="--i:3">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="dow">${d}</div>`).join('')}</div><div class="grid ${cdir}" id="cg" style="margin-top:.5rem">${cells}</div>`}
function vList(){const ts=sorted();if(!ts.length)return `<h2 class="rise">The <em>List</em></h2><div class="empty rise" style="--i:1">Nothing yet. A blank page is a lovely thing.</div>`;
const g={};ts.forEach(t=>(g[t.date||'Someday']??=[]).push(t));let i=2,h=`<h2 class="rise">The <em>List</em></h2><p class="sub rise" style="--i:1">${S.tasks.filter(t=>!t.done).length} remaining · ${S.tasks.filter(t=>t.done).length} complete</p>`;
for(const [d,a] of Object.entries(g)){h+=`<div class="group"><h4 class="rise" style="--i:${i++}">${d===TODAY?'Today':fd(d)}</h4>`+a.map(t=>`<div class="card hov row rise ${t.done?'done':''}" style="--i:${i++}" data-id="${t.id}"><button class="chk ${t.done?'on':''}" data-chk="${t.id}">✓</button><div class="t"><strong>${esc(t.title)}</strong><small>${rng(t)}${t.notes?' · '+esc(t.notes):''}</small></div><span class="pri p-${t.pri}">${PN[t.pri]}</span></div>`).join('')+'</div>'}return h}
function vTable(){const k=sort.k,ts=[...S.tasks].sort((a,b)=>{let x=k==='pri'?PW[a.pri]:(a[k]||'~'),y=k==='pri'?PW[b.pri]:(b[k]||'~');return(x<y?-1:x>y?1:0)*sort.d});
const th=(k,l)=>`<th data-s="${k}">${l}${sort.k===k?(sort.d>0?' ↑':' ↓'):''}</th>`;
return `<h2 class="rise">The <em>Ledger</em></h2><p class="sub rise" style="--i:1">Click a heading to reorder.</p><div class="scroll rise" style="--i:2"><table class="tbl"><thead><tr><th></th>${th('title','Task')}${th('pri','Priority')}${th('date','Date')}${th('start','Start')}${th('end','End')}</tr></thead><tbody>${ts.map((t,i)=>`<tr class="rise" style="--i:${i+3}" data-id="${t.id}"><td><button class="chk ${t.done?'on':''}" data-chk="${t.id}">✓</button></td><td class="ti" style="${t.done?'text-decoration:line-through;opacity:.5':''}">${esc(t.title)}</td><td><span class="pri p-${t.pri}">${PN[t.pri]}</span></td><td>${fd(t.date)}</td><td>${tm(t.start)}</td><td>${tm(t.end)}</td></tr>`).join('')}</tbody></table></div>`}
function vStudy(){let i=2;return `<h2 class="rise">The <em>Study</em></h2><p class="sub rise" style="--i:1">Build a plan: subjects, topics, chapters, and the hours you’ll give them.</p><button class="btn solid rise" style="--i:2" id="ns">+ Study Plan</button><div class="studygrid" style="margin-top:1.6rem">`+(S.study.length?S.study.map(s=>{const n=s.items.length,d=s.items.filter(x=>x.done).length,p=n?d/n:0,C=2*Math.PI*27;
return `<div class="card hov sc rise" style="--i:${i++}"><header><h3>${esc(s.subject)}</h3><svg class="ring" viewBox="0 0 64 64"><circle class="bg" cx="32" cy="32" r="27"/><circle class="fg" cx="32" cy="32" r="27" transform="rotate(-90 32 32)" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}"/><text x="32" y="38" text-anchor="middle" font-family="Cormorant Garamond,serif" font-size="18" font-weight="600" fill="currentColor">${Math.round(p*100)}%</text></svg><button class="x ed" data-es="${s.id}" title="Edit plan">✎</button><button class="x" data-ds="${s.id}">×</button></header><div style="margin-top:1rem">`+[...s.items].sort((a,b)=>(a.date+a.start)<(b.date+b.start)?-1:1).map(x=>`<div class="it ${x.done?'done':''}"><button class="chk ${x.done?'on':''}" data-si="${s.id}|${x.id}">✓</button><span class="n"><span class="n">${esc(x.topic)}</span><small>${esc(x.chapter)} · ${fd(x.date)} · ${rng(x)}</small></span></div>`).join('')+`</div></div>`}).join(''):'<div class="empty rise" style="--i:3">No study plans yet.</div>')+'</div>'}
function bind(){const q=(s,f)=>document.querySelectorAll(s).forEach(f);
q('[data-nav]',b=>b.onclick=()=>{const d=+b.dataset.nav;cal.m+=d;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}cdir=d>0?'fl':'fr';render(false);cdir=''});
q('.day',d=>{d.onclick=e=>{const c=e.target.closest('.chip[data-id]');c?openTask(S.tasks.find(t=>t.id===c.dataset.id),e,c):openTask({date:d.dataset.date},e,d)};
d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
d.ondrop=e=>{e.preventDefault();const t=S.tasks.find(t=>t.id===e.dataTransfer.getData('text/plain'));if(t&&t.date!==d.dataset.date){t.date=d.dataset.date;save();render(false);const c=document.querySelector(`.chip[data-id="${t.id}"]`);c&&c.animate([{transform:'scale(1.9) translateY(-34px)',opacity:0,filter:'blur(6px)'},{transform:'none',opacity:1,filter:'none'}],{duration:1000,easing:'cubic-bezier(.22,.9,.22,1)'})}else d.classList.remove('over')}});
q('.chip[draggable]',c=>{c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';setTimeout(()=>c.classList.add('drag'))};c.ondragend=()=>c.classList.remove('drag')});
q('[data-chk]',b=>b.onclick=e=>{e.stopPropagation();const t=S.tasks.find(t=>t.id===b.dataset.chk);t.done=!t.done;save();render(false)});
q('.row,.tbl tr[data-id]',r=>r.onclick=e=>openTask(S.tasks.find(t=>t.id===r.dataset.id),e,r));
q('[data-s]',h=>h.onclick=()=>{sort=sort.k===h.dataset.s?{k:sort.k,d:-sort.d}:{k:h.dataset.s,d:1};render(false)});
q('[data-si]',b=>b.onclick=()=>{const[a,c]=b.dataset.si.split('|'),x=S.study.find(s=>s.id===a).items.find(i=>i.id===c);x.done=!x.done;save();render(false)});
q('[data-ds]',b=>b.onclick=()=>{S.study=S.study.filter(s=>s.id!==b.dataset.ds);save();render(false)});
const ns=$('#ns');if(ns)ns.onclick=e=>openStudy(null,e,ns);q('[data-es]',b=>b.onclick=e=>openStudy(S.study.find(s=>s.id===b.dataset.es),e,b.closest('.sc')))}
/* modal */
const veil=$('#veil'),sheet=$('#sheet'),EZ='cubic-bezier(.7,0,.2,1)';
const flip=(a,b)=>`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${a.width/b.width},${a.height/b.height})`;
function open(html,e,src){veil.classList.remove('morph');sheet.getAnimations().forEach(a=>a.cancel());
const r=e&&e.clientX?e:{clientX:innerWidth/2,clientY:innerHeight/2};veil.style.setProperty('--x',r.clientX+'px');veil.style.setProperty('--y',r.clientY+'px');
sheet.innerHTML=html;[...sheet.children].forEach((c,i)=>c.style.setProperty('--i',i));veil._src=src||null;
if(!src){requestAnimationFrame(()=>requestAnimationFrame(()=>veil.classList.add('open')));return}
veil.classList.add('morph','open');const a=src.getBoundingClientRect(),b=sheet.getBoundingClientRect();
sheet.animate([{transformOrigin:'0 0',transform:flip(a,b),opacity:.25},{transformOrigin:'0 0',transform:'none',opacity:1}],{duration:1250,easing:EZ})}
function close(){if(!veil.classList.contains('open'))return;const src=veil._src;
if(src&&document.contains(src)){const a=src.getBoundingClientRect(),b=sheet.getBoundingClientRect();
[...sheet.children].forEach(c=>c.animate([{opacity:1},{opacity:0}],{duration:250,fill:'forwards'}));
sheet.animate([{transformOrigin:'0 0',transform:'none',opacity:1},{transformOrigin:'0 0',transform:flip(a,b),opacity:0}],{duration:950,easing:EZ,fill:'forwards'})}
veil.classList.remove('open')}
veil.onclick=e=>{if(e.target===veil)close()};addEventListener('keydown',e=>e.key==='Escape'&&close());
function openTask(t,e,src){const n=!t.id;let pri=t.pri||'med';
open(`<h3>${n?'A new task':'Edit task'}</h3><input class="big" id="f-t" placeholder="What shall be done?" value="${esc(t.title||'')}">
<div><label>Priority</label><div class="pills">${['low','med','high'].map(p=>`<button data-p="${p}" class="p-${p} ${p===pri?'on':''}">${PN[p]}</button>`).join('')}</div></div>
<div class="three"><div><label>Date</label><input type="date" id="f-d" value="${t.date||TODAY}"></div><div><label>Start</label><input type="time" id="f-s" value="${t.start||''}"></div><div><label>End</label><input type="time" id="f-e" value="${t.end||''}"></div></div>
<div><label>Notes</label><textarea id="f-n" rows="2">${esc(t.notes||'')}</textarea></div>
<div class="acts">${n?'':'<button class="btn" id="f-x">Delete</button>'}<button class="btn" id="f-c">Cancel</button><button class="btn solid" id="f-ok">${n?'Create':'Save'}</button></div>`,e,src);
sheet.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pri=b.dataset.p;sheet.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x===b))});
$('#f-c').onclick=close;const x=$('#f-x');if(x)x.onclick=()=>{S.tasks=S.tasks.filter(a=>a.id!==t.id);save();close();render(false)};
$('#f-ok').onclick=()=>{const title=$('#f-t').value.trim();if(!title){$('#f-t').focus();return}
const o={title,pri,date:$('#f-d').value,start:$('#f-s').value,end:$('#f-e').value,notes:$('#f-n').value};
if(n){S.tasks.push({id:uid(),done:false,...o});celebrate(title,'A new task, beautifully begun')}else Object.assign(t,o);save();close();render(false)};
setTimeout(()=>$('#f-t').focus(),1100)}
function srow(x={}){return `<div class="srow" data-id="${x.id||''}"><input placeholder="Topic" class="a" value="${esc(x.topic)}"><input placeholder="Chapter" class="b" value="${esc(x.chapter==='—'?'':x.chapter)}"><input type="date" class="c" value="${x.date||TODAY}"><input type="time" class="d" value="${x.start||'18:00'}"><input type="time" class="e" value="${x.end||'19:00'}"><button class="x" onclick="this.parentNode.remove()">×</button></div>`}
function openStudy(p,e,src){const n=!p;open(`<h3>${n?'Study creator':'Edit study plan'}</h3><input class="big" id="s-n" placeholder="Subject, e.g. Organic Chemistry" value="${esc(p?.subject)}"><div><label>Sessions — topic · chapter · date · start · end</label><div id="rows">${n?srow()+srow():p.items.map(i=>srow(i)).join('')}</div></div>
<div class="acts" style="justify-content:space-between"><button class="btn" id="s-a">+ Add session</button><span style="display:flex;gap:.8rem"><button class="btn" id="s-c">Cancel</button><button class="btn solid" id="s-ok">${n?'Create plan':'Save plan'}</button></span></div>`,e,src);
$('#s-a').onclick=()=>$('#rows').insertAdjacentHTML('beforeend',srow());$('#s-c').onclick=close;
$('#s-ok').onclick=()=>{const subject=$('#s-n').value.trim();if(!subject){$('#s-n').focus();return}
const old=p?p.items:[],items=[...document.querySelectorAll('.srow')].map(r=>{const id=r.dataset.id||uid(),o=old.find(i=>i.id===id);return{id,topic:$('.a',r).value||'Untitled',chapter:$('.b',r).value||'—',date:$('.c',r).value,start:$('.d',r).value,end:$('.e',r).value,done:o?o.done:false}});
if(p){p.subject=subject;p.items=items}else S.study.push({id:uid(),subject,items});save();close();
if(n){celebrate(subject,'A study plan, ready to unfold');view='study';render(true);ink()}else render(false)};setTimeout(()=>$('#s-n').focus(),1100)}
function celebrate(text,sub){const c=$('#cele');c.className='cele';c.innerHTML=`<div><small>${esc(sub)}</small><h1>${[...text].map((ch,i)=>`<i style="--k:${i}">${ch===' '?'&nbsp;':esc(ch)}</i>`).join('')}</h1><hr></div>`;
void c.offsetWidth;requestAnimationFrame(()=>c.classList.add('in'));setTimeout(()=>{c.classList.replace('in','out')},2900+Math.min(text.length,30)*30);setTimeout(()=>{c.className='cele';c.innerHTML=''},4900+Math.min(text.length,30)*30)}
$('#new').onclick=e=>openTask({date:TODAY},e,$('#new'));
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
addEventListener('resize',ink);document.fonts&&document.fonts.ready.then(ink);render(true);ink();
</script></body></html>
